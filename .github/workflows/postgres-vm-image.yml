name: Build PostgreSQL VM Image
run-name: Build ${{ inputs.image_suffix }}${{ inputs.ubuntu_2604 && ' ubuntu-2604' || '' }}${{ inputs.ubuntu_2204 && ' ubuntu-2204' || '' }} ${{ inputs.image_prefix }}

on:
  workflow_dispatch:
    inputs:
      image_prefix:
        description: "Prefix for image name (optional)"
        type: string
        default: ""
      image_suffix:
        description: "Suffix for image name (e.g., YYYYMMDD.X.Y)"
        type: string
        required: true
      image_resize_gb:
        description: "Target final image size in GB (exact size, not additional space)"
        required: true
        default: 12
        type: number
      ubuntu_2604:
        description: "Build ubuntu-2604 images"
        default: true
        type: boolean
      ubuntu_2204:
        description: "Build ubuntu-2204 images"
        default: false
        type: boolean
      build_only:
        description: "⚡ Build only (skip all uploads) - for testing"
        default: false
        type: boolean
      build_arm64:
        description: "Build ARM64 image"
        default: false
        type: boolean
      run_apt_upgrade:
        description: "Run apt upgrade during build (can be slow and unnecessary on recently built runners)"
        default: true
        type: boolean
      upload_image:
        description: "📤 Upload to MinIO (ignored if build_only)"
        default: false
        type: boolean
      upload_r2:
        description: "📤 Upload to R2 (ignored if build_only)"
        default: false
        type: boolean
      upload_gce:
        description: "📤 Create GCE image"
        default: false
        type: boolean
      upload_aws_ami:
        description: "📤 Create AWS AMI"
        default: false
        type: boolean
      aws_ami_regions:
        description: "AWS regions for AMI"
        type: string
        default: "us-west-2,us-east-1,us-east-2,eu-west-1,ap-southeast-2"
      create_ubicloud_pr:
        description: "🔄 Create PR to ubicloud/ubicloud with updated image versions"
        default: false
        type: boolean
      test_pr_creation:
        description: "🧪 TEST ONLY: Skip builds, use dummy values to test PR creation"
        default: false
        type: boolean
      use_aws_role:
        description: "Use AWS role-based authentication (if false, uses access keys)"
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: ubuntu-${{ matrix.ubuntu_release }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu_release: ${{ fromJSON(inputs.ubuntu_2604 && inputs.ubuntu_2204 && '["2604","2204"]' || inputs.ubuntu_2604 && '["2604"]' || inputs.ubuntu_2204 && '["2204"]' || '[]') }}
    uses: ./.github/workflows/postgres-vm-image-build.yml
    with:
      image_prefix: ${{ inputs.image_prefix }}
      image_suffix: ${{ inputs.image_suffix }}
      image_resize_gb: ${{ fromJSON(inputs.image_resize_gb) }}
      ubuntu_release: ${{ matrix.ubuntu_release }}
      build_only: ${{ inputs.build_only }}
      build_arm64: ${{ inputs.build_arm64 }}
      run_apt_upgrade: ${{ inputs.run_apt_upgrade }}
      upload_image: ${{ inputs.upload_image }}
      upload_r2: ${{ inputs.upload_r2 }}
      upload_gce: ${{ inputs.upload_gce }}
      upload_aws_ami: ${{ inputs.upload_aws_ami }}
      aws_ami_regions: ${{ inputs.aws_ami_regions }}
      create_ubicloud_pr: ${{ inputs.create_ubicloud_pr }}
      test_pr_creation: ${{ inputs.test_pr_creation }}
      use_aws_role: ${{ inputs.use_aws_role }}
    secrets: inherit
